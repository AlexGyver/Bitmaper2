*Brightness, Contrast, Saturation**: яркость, контраст, насыщенность\n- **Blur**: размытие\n- **Mask**: выделение цвета на изображении, результат - маска в градациях серого\n  - **Color**: целевой цвет. На десктопной версии можно выбрать "пипеткой" по превью. Чтобы использовать пипетку при активном фильтре, нужно сначала отключить фильтр, чтобы изображение обратно стало цветным\n  - **Tolerance**: допуск цвета. Чем больше - тем менее похожие цвета попадут в маску\n  - **Amplify**: усиление маски (делает результат более ярким)\n- **Gray Filters**: блок серых фильтров, при активации изображение переводится в градации серого\n  - **Edges Simple**: простое усиление краёв\n  - **Edges Sobel**: выделение краёв по алгоритму Sobel\n  - **Dithering**: дизеринг\n  - **Threshold**: перевод в ч/б с заданным порогом\n  - **Edges Median**: выделение краёв (ширина 1 пиксель)\n  - **Invert**: инвертирование\n\n### Алгоритмы кодирования\n\n- **1 pix/byte**: моно, 1 пиксель в байте, строками слева направо сверху вниз, [p0, ...pn]\n- **8x Horizontal**: моно, 8 пикселей в байте горизонтально (LSB слева), строками слева направо сверху вниз, [p0, ...pn]. *Подходит для u8glib*\n- **8x Horizontal MSB**: моно, 8 пикселей в байте горизонтально (MSB слева), строками слева направо сверху вниз, [p0, ...pn]\n- **8x Vertical Col**: моно, 8 пикселей в байте вертикально (LSB сверху), столбцами сверху вниз слева направо, [p0, ...pn]\n- **8x Vertical Row**: моно, 8 пикселей в байте вертикально (LSB сверху), строками слева направо сверху вниз, [p0, ...pn]. *Подходит для GyverOLED*\n- **GyverGFX Image**: программа выберет лёгкий между BitMap и BitPack, [0 map | 1 pack, x, x, x, x, p0, ...pn]\n- **GyverGFX BitMap**: моно, 8 пикселей вертикально (LSB сверху), столбцами сверху вниз слева направо, [widthLSB, widthMSB, heightLSB, heightMSB, p0, ...pn]\n- **GyverGFX BitPack**: моно, сжатый RLE формат, [widthLSB, widthMSB, heightLSB, heightMSB, p0, ...pn]\n- **Grayscale**: оттенки серого, 1 пиксель в байте, [p0, ...pn]\n- **RGB24**: цветной, 1 пиксель на 4 байта, [p0, ...pn], тип uint32_t\n- **RGB888**: цветной, 1 пиксель на 3 байта (24 бит RGB) [r0, g0, b0, ...]\n- **RGB565**: цветной, 1 пиксель на 2 байта (16 бит RGB) [rrrrrggggggbbbbb, ...] тип uint16_t\n- **RGB233**: цветной, 1 пиксель в байте (8 бит RGB) [rrgggbbb, ...]\n- **ASCII**: кодирование символами\n');let Wt={};function Lt(){t.update(document.body,{ctx:Wt,children:[{tag:"header",children:[{class:"bt_btns",children:[{class:"bt_btn icon bars",onClick:()=>{Wt.$ui_in.classList.toggle("ui_hidden"),Wt.$ui_out.classList.add("ui_hidden")}},{class:"bt_btn icon code",onClick:()=>{Wt.$ui_in.classList.add("ui_hidden"),Wt.$ui_out.classList.toggle("ui_hidden")}},{class:"icon info",onClick:()=>{Wt.$help.classList.toggle("hidden")}}]},{text:"Bitmaper v2"},{style:"display:flex",child:{class:"icon moon",onClick:t=>(nt=!nt,ot(nt),H.set("darkmode",nt),void gt())}}]},{tag:"main",children:[{class:"ui_in",$:"ui_in"},{class:"ui_out ui_hidden",$:"ui_out"},{class:"cv_col",children:[{tag:"canvas",$:"cvimg"},{tag:"canvas",$:"cvres"}]}]},{class:"help_overlay hidden",$:"help",onClick:t=>{Wt.$help.classList.toggle("hidden")},child:{class:"help_cont",children:[{html:Mt}]}}]})}"serviceWorker"in navigator&&"undefined"!=typeof USE_SW&&navigator.serviceWorker.register("sw.js"),document.addEventListener("DOMContentLoaded",()=>{Lt(),lt()})})();</script><style type="text/css">body{--ratio:0.5;--maxw:900px;--mid:#ccc;--tab:#f0f0f0;--font:#000;--back:#fff}body.darkmode{--mid:#22272e;--tab:#2d333b;--font:#ccc;--back:#1e232a}body,html{background:var(--tab);font-family:monospace;height:100%;margin:0;padding:0;width:100%}body{flex-direction:column;height:100vh}body,header{display:flex}header{align-items:center;background:var(--mid);color:var(--font);flex-direction:row;font-size:18px;justify-content:space-between;position:fixed;width:100%;z-index:1}header>div{padding:6px 8px}main{display:flex;flex:1;padding-top:40px;position:relative}.cv_col{width:100%
