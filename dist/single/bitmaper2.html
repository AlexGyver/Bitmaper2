ы использовать пипетку при активном фильтре, нужно сначала отключить фильтр, чтобы изображение обратно стало цветным\n  - **Tolerance**: допуск цвета. Чем больше - тем менее похожие цвета попадут в маску\n  - **Amplify**: усиление маски (делает результат более ярким)\n- **Gray Filters**: блок серых фильтров, при активации изображение переводится в градации серого\n  - **Edges Simple**: простое усиление краёв\n  - **Edges Sobel**: выделение краёв по алгоритму Sobel\n  - **Dithering**: дизеринг\n  - **Threshold**: перевод в ч/б с заданным порогом\n  - **Edges Median**: выделение краёв\n  - **Contour**: выделение контуров шириной в 1 пиксель. Для управляемого результата нужен предварительный Threshold\n  - **Invert**: инвертирование\n\n### Алгоритмы кодирования\n\n- **1 pix/byte**: моно, 1 пиксель в байте, строками слева направо сверху вниз, [p0, ...pn]\n- **8x Horizontal**: моно, 8 пикселей в байте горизонтально (LSB слева), строками слева направо сверху вниз, [p0, ...pn]. *Подходит для u8glib*\n- **8x Horizontal MSB**: моно, 8 пикселей в байте горизонтально (MSB слева), строками слева направо сверху вниз, [p0, ...pn]\n- **8x Vertical Col**: моно, 8 пикселей в байте вертикально (LSB сверху), столбцами сверху вниз слева направо, [p0, ...pn]\n- **8x Vertical Row**: моно, 8 пикселей в байте вертикально (LSB сверху), строками слева направо сверху вниз, [p0, ...pn]. *Подходит для GyverOLED*\n- **GyverGFX Image**: программа выберет лёгкий между BitMap и BitPack, [0 map | 1 pack, x, x, x, x, p0, ...pn]\n- **GyverGFX BitMap**: моно, 8 пикселей вертикально (LSB сверху), столбцами сверху вниз слева направо, [widthLSB, widthMSB, heightLSB, heightMSB, p0, ...pn]\n- **GyverGFX BitPack**: моно, сжатый RLE формат, [widthLSB, widthMSB, heightLSB, heightMSB, p0, ...pn]\n- **Grayscale**: оттенки серого, 1 пиксель в байте, [p0, ...pn]\n- **RGB24**: цветной, 1 пиксель на 4 байта, [p0, ...pn], тип uint32_t\n- **RGB888**: цветной, 1 пиксель на 3 байта (24 бит RGB) [r0, g0, b0, ...]\n- **RG
